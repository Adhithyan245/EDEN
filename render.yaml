# Render Blueprint for EDEN's backend. In the Render dashboard:
# New → Blueprint → pick this repo. Render asks for the `sync: false` secrets.
services:
  - type: web
    name: eden-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Secrets — entered in the dashboard, never committed.
      - key: GEMINI_API_KEY
        sync: false
      # Fallback voice when Gemini's free speech quota runs out (optional).
      - key: ELEVENLABS_API_KEY
        sync: false
      # Open to everyone: no EDEN_ACCESS_CODE. Set one in the dashboard to make
      # the UI ask visitors for a code.
      # The Vercel URL(s) allowed to open the socket, comma-separated.
      - key: EDEN_ALLOWED_ORIGINS
        value: https://eden-alpha-sable.vercel.app,https://eden-adhithyan245s-projects.vercel.app
      - key: EDEN_MODE
        value: SAFE
      - key: EDEN_AGENT_ENABLED
        value: "true"
      # Memory is one shared store; on a public server it would mix visitors.
      - key: EDEN_MEMORY_ENABLED
        value: "false"
      # Streamed Gemini voice: natural, ~1 s to first audio, same key. When its
      # quota runs out, ElevenLabs speaks (if its key is set), then the browser.
      - key: EDEN_VOICE_ENABLED
        value: "true"
      - key: EDEN_TTS_PROVIDER
        value: gemini
      - key: EDEN_USER_NAME
        value: there
      - key: EDEN_MAX_MESSAGES_PER_MINUTE
        value: "12"
      - key: EDEN_MAX_AGENT_TASKS_PER_HOUR
        value: "30"
      - key: EDEN_MAX_AGENT_TASKS_PER_IP_PER_HOUR
        value: "6"
